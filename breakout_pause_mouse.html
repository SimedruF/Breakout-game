<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Breakout - Pasul 1</title>
  <style>
    body { margin: 0; background: #111; display: grid; place-items: center; height: 100vh; }
    canvas { background: #0b0b0b; border: 1px solid #333; }
    .hint { color: #bbb; font: 14px/1.3 system-ui, sans-serif; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div>
    <canvas id="game" width="800" height="500"></canvas>
    <div class="hint">Stânga/Dreapta sau mouse pentru paletă. Space: start/next/restart. P: pauză.</div>
  </div>

  <script>
    "use strict";

    // --- Setup canvas ---
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // --- Input ---
    const keys = { left: false, right: false };

    const mouse = { active: false, x: canvas.width / 2 };
    
    // Mouse / pointer control (move paddle by moving the cursor over the canvas)
    function updateMouseX(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const x = (clientX - rect.left) * scaleX;
      mouse.x = x;
      mouse.active = true;
    }
    
    canvas.addEventListener("mousemove", (e) => {
      updateMouseX(e.clientX, e.clientY);
    });
    
    canvas.addEventListener("mouseleave", () => {
      mouse.active = false;
    });
    
    // Optional: Pointer events (touch/pen)
    canvas.addEventListener("pointermove", (e) => {
      updateMouseX(e.clientX, e.clientY);
    });

    // --- Game state ---
    const paddle = {
      w: 120,
      h: 14,
      x: (canvas.width - 120) / 2,
      y: canvas.height - 40,
      speed: 520 // pixeli/secundă
    };

    const ball = {
      r: 9,
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 260,  // pixeli/secundă
      vy: -320  // pixeli/secundă
    };
    const MAX_BOUNCE_ANGLE = (60 * Math.PI) / 180; // 60°

    const game = {
    score: 0,
    lives: 3,
    level: 1,
    status: "SERVE" // SERVE | PLAYING | PAUSED | WIN | GAME_OVER
    };

    // --- Bricks configuration ---
    const BASE_BALL_SPEED = 300;     // px/s (Level 1)
    const SPEED_PER_LEVEL = 0.12;    // +12% per level
    const BASE_BRICK_ROWS = 6;
    const MAX_BRICK_ROWS = 10;
    
    let brickRows = BASE_BRICK_ROWS;
    const BRICK_COLS = 10;
    const BRICK_GAP = 8;
    const BRICK_TOP = 60;
    const BRICK_SIDE_MARGIN = 40;
    const BRICK_H = 22;


    // calculăm lățimea cărămizii ca să încapă perfect pe canvas
    const BRICK_W =
    (canvas.width - 2 * BRICK_SIDE_MARGIN - (BRICK_COLS - 1) * BRICK_GAP) / BRICK_COLS;

    let bricks = [];

    function buildBricks(rows) {
    const arr = [];
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
        const x = BRICK_SIDE_MARGIN + c * (BRICK_W + BRICK_GAP);
        const y = BRICK_TOP + r * (BRICK_H + BRICK_GAP);
        arr.push({ x, y, w: BRICK_W, h: BRICK_H, alive: true });
        }
    }
    return arr;
    }

    function resetBallAndPaddle() {
    paddle.x = (canvas.width - paddle.w) / 2;

    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r;
    ball.vx = 0;
    ball.vy = 0;
    }

    function ballSpeedForLevel(level) {
    return BASE_BALL_SPEED * (1 + (level - 1) * SPEED_PER_LEVEL);
    }

    function rowsForLevel(level) {
    return Math.min(MAX_BRICK_ROWS, BASE_BRICK_ROWS + (level - 1));
    }

    function startLevel(level) {
    game.level = level;
    brickRows = rowsForLevel(level);
    bricks = buildBricks(brickRows);
    resetBallAndPaddle();
    game.status = "SERVE";
    }

    function launchBall() {
    // un unghi inițial controlabil (în sus), ca să nu plece perfect vertical
    const speed = ballSpeedForLevel(game.level);
    const angle = (-Math.PI / 2) + (Math.random() * 0.8 - 0.4); // -90° ± ~23°
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    game.status = "PLAYING";
    }

    function resetGame() {
    game.score = 0;
    game.lives = 3;
    startLevel(1);
    }

    // Inițializăm jocul
    resetGame();

    window.window.addEventListener("keydown", (e) => {
    if (e.code === "ArrowLeft") { keys.left = true; e.preventDefault(); }
    if (e.code === "ArrowRight") { keys.right = true; e.preventDefault(); }

    if (e.code === "Space") {
        e.preventDefault();
        if (game.status === "SERVE") {
            launchBall();
        } else if (game.status === "WIN") {
            startLevel(game.level + 1);
        } else if (game.status === "GAME_OVER") {
            resetGame();
        }
    }
    
    if (e.code === "KeyP") {
        e.preventDefault();
        // Pause is only meaningful during gameplay
        if (game.status === "PLAYING") {
            game.status = "PAUSED";
        } else if (game.status === "PAUSED") {
            game.status = "PLAYING";
        }
    }

    });

    window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft") keys.left = false;
    if (e.code === "ArrowRight") keys.right = false;
    });

    // --- Timing ---
    let lastTs = performance.now();

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function update(dt) {
    // mișcare paletă în toate stările (inclusiv SERVE / PAUSED)
    if (mouse.active) {
        paddle.x = clamp(mouse.x - paddle.w / 2, 0, canvas.width - paddle.w);
    } else {
        let dir = 0;
        if (keys.left) dir -= 1;
        if (keys.right) dir += 1;

        paddle.x += dir * paddle.speed * dt;
        paddle.x = clamp(paddle.x, 0, canvas.width - paddle.w);
    }

    // Pauză: îngheață logica de joc, dar permite repoziționarea paletei
    if (game.status === "PAUSED") return;

    if (game.status === "SERVE") {
        // mingea stă pe paletă
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r;
        return;
    }

    if (game.status !== "PLAYING") return;

    // --- Ball movement ---
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // --- Wall collisions ---
    if (ball.x - ball.r < 0) {
        ball.x = ball.r;
        ball.vx *= -1;
    } else if (ball.x + ball.r > canvas.width) {
        ball.x = canvas.width - ball.r;
        ball.vx *= -1;
    }

    if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.vy *= -1;
    }

    // --- Paddle collision (bounce with angle) ---
    if (ball.vy > 0) {
        const paddleLeft = paddle.x;
        const paddleRight = paddle.x + paddle.w;
        const paddleTop = paddle.y;
        const paddleBottom = paddle.y + paddle.h;

        const ballLeft = ball.x - ball.r;
        const ballRight = ball.x + ball.r;
        const ballTop = ball.y - ball.r;
        const ballBottom = ball.y + ball.r;

        const intersects =
        ballRight >= paddleLeft &&
        ballLeft <= paddleRight &&
        ballBottom >= paddleTop &&
        ballTop <= paddleBottom;

        if (intersects) {
        ball.y = paddleTop - ball.r;

        const paddleCenter = paddle.x + paddle.w / 2;
        let hit = (ball.x - paddleCenter) / (paddle.w / 2);
        hit = Math.max(-1, Math.min(1, hit));

        const speed = Math.hypot(ball.vx, ball.vy) * 1.003; // +0.3% per hit
        const angle = hit * MAX_BOUNCE_ANGLE;

        ball.vx = speed * Math.sin(angle);
        ball.vy = -Math.abs(speed * Math.cos(angle));
        }
    }

    // --- Brick collisions ---
    const ballLeft = ball.x - ball.r;
    const ballRight = ball.x + ball.r;
    const ballTop = ball.y - ball.r;
    const ballBottom = ball.y + ball.r;

    let bricksLeft = 0;

    for (const br of bricks) {
        if (!br.alive) continue;
        bricksLeft++;

        const brLeft = br.x;
        const brRight = br.x + br.w;
        const brTop = br.y;
        const brBottom = br.y + br.h;

        const hit =
        ballRight >= brLeft &&
        ballLeft <= brRight &&
        ballBottom >= brTop &&
        ballTop <= brBottom;

        if (hit) {
        br.alive = false;
        game.score += 10;

        // determinăm axa de ricoșeu pe baza „penetrării” minime
        const overlapX = Math.min(ballRight - brLeft, brRight - ballLeft);
        const overlapY = Math.min(ballBottom - brTop, brBottom - ballTop);

        if (overlapX < overlapY) {
            // bounce pe X
            if (ball.x < br.x + br.w / 2) ball.x -= overlapX;
            else ball.x += overlapX;
            ball.vx *= -1;
        } else {
            // bounce pe Y
            if (ball.y < br.y + br.h / 2) ball.y -= overlapY;
            else ball.y += overlapY;
            ball.vy *= -1;
        }

        // lovim maxim o cărămidă per frame (simplificare stabilă)
        break;
        }
    }

    // Win condition (dacă nu mai există cărămizi)
    if (bricksLeft === 0) {
    game.status = "WIN";
    return;
    }

    // --- Bottom: lose a life ---
    if (ball.y - ball.r > canvas.height) {
    game.lives -= 1;
    if (game.lives <= 0) {
        game.status = "GAME_OVER";
    } else {
        resetBallAndPaddle();
        game.status = "SERVE";
    }
    }
    }


    function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Bricks
    for (let i = 0; i < bricks.length; i++) {
        const br = bricks[i];
        if (!br.alive) continue;

        // variație discretă pe rând (fără să complicăm)
        const row = Math.floor(i / BRICK_COLS);
        ctx.fillStyle = row % 2 === 0 ? "#d6d6d6" : "#bdbdbd";
        ctx.fillRect(br.x, br.y, br.w, br.h);
    }

    // Paddle
    ctx.fillStyle = "#e6e6e6";
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#e6e6e6";
    ctx.fill();
    ctx.closePath();

    // HUD
    ctx.fillStyle = "#9aa0a6";
    ctx.font = "14px system-ui, sans-serif";
    ctx.fillText(`Score: ${game.score}`, 10, 22);
    ctx.fillText(`Lives: ${game.lives}`, 110, 22);

    // Overlay for WIN / GAME OVER
    if (game.status !== "PLAYING") {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#e6e6e6";
    ctx.font = "26px system-ui, sans-serif";

    let msg = "";
    let msg2 = "";

    if (game.status === "SERVE") {
        msg = `LEVEL ${game.level}`;
        msg2 = "Apasă SPACE pentru start";
    }
    else if (game.status === "PAUSED") {
        msg = "PAUSED";
        msg2 = "Apasă P pentru a continua";
    } else if (game.status === "WIN") {
        msg = "YOU WIN";
        msg2 = "Apasă Space pentru nivelul următor";
    } else if (game.status === "GAME_OVER") {
        msg = "GAME OVER";
        msg2 = "Apasă Space pentru restart";
    }

    const w1 = ctx.measureText(msg).width;
    ctx.fillText(msg, (canvas.width - w1) / 2, canvas.height / 2 - 10);

    ctx.font = "16px system-ui, sans-serif";
    const w2 = ctx.measureText(msg2).width;
    ctx.fillText(msg2, (canvas.width - w2) / 2, canvas.height / 2 + 24);
    }
    }



    function loop(ts) {
      const dt = (ts - lastTs) / 1000; // secunde
      lastTs = ts;

      // Protecție simplă dacă tab-ul a fost inactiv (dt mare)
      const safeDt = Math.min(dt, 1 / 30);

      update(safeDt);
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  
  </script>
</body>
</html>
