<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Breakout - Pasul 1</title>
  <style>
    body { margin: 0; background: #111; display: grid; place-items: center; height: 100vh; }
    canvas { background: #0b0b0b; border: 1px solid #333; }
    .hint { color: #bbb; font: 14px/1.3 system-ui, sans-serif; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div>
    <canvas id="game" width="800" height="500"></canvas>
    <div class="hint">Stânga/Dreapta pentru paletă. Pasul 1: doar paleta + bucla de joc.</div>
  </div>

  <script>
    "use strict";

    // --- Setup canvas ---
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // --- Input ---
    const keys = { left: false, right: false };

    // --- Game state ---
    const paddle = {
      w: 120,
      h: 14,
      x: (canvas.width - 120) / 2,
      y: canvas.height - 40,
      speed: 520 // pixeli/secundă
    };
    const PADDLE_BASE_W = paddle.w;

    const ball = {
      r: 9,
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 0,
      vy: 0
    };
    const MAX_BOUNCE_ANGLE = (60 * Math.PI) / 180; // 60°

    const game = {
    score: 0,
    lives: 3,
    level: 1,
    status: "SERVE", // SERVE | PLAYING | WIN | GAME_OVER
    ballSpeedLimit: null // folosit de power-up-ul "SLOW"
    };

    // --- Bricks configuration ---
    const BASE_BALL_SPEED = 300;     // px/s (Level 1)
    const SPEED_PER_LEVEL = 0.12;    // +12% per level
    const BASE_BRICK_ROWS = 6;
    const MAX_BRICK_ROWS = 10;
    
    let brickRows = BASE_BRICK_ROWS;
    const BRICK_COLS = 10;
    const BRICK_GAP = 8;
    const BRICK_TOP = 60;
    const BRICK_SIDE_MARGIN = 40;
    const BRICK_H = 22;


    // calculăm lățimea cărămizii ca să încapă perfect pe canvas
    const BRICK_W =
    (canvas.width - 2 * BRICK_SIDE_MARGIN - (BRICK_COLS - 1) * BRICK_GAP) / BRICK_COLS;

    let bricks = [];

    // --- Power-ups ---
    const POWERUP_CHANCE = 0.18;          // 18% șansă să pice un power-up când spargi o cărămidă
    const POWERUP_FALL_SPEED = 170;       // px/s
    const POWERUP_SIZE = 18;              // px (pătrat)
    const POWERUP_WIDE_MULT = 1.5;        // lățime paletă
    const POWERUP_WIDE_MS = 10000;        // 10 sec
    const POWERUP_SLOW_FACTOR = 0.75;     // limită viteză minge (75% din viteza nivelului)
    const POWERUP_SLOW_MS = 8000;         // 8 sec

    const powerUps = []; // {x,y,vy,size,type}
    let wideTimeoutId = null;
    let slowTimeoutId = null;

    function buildBricks(rows) {
    const arr = [];
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
        const x = BRICK_SIDE_MARGIN + c * (BRICK_W + BRICK_GAP);
        const y = BRICK_TOP + r * (BRICK_H + BRICK_GAP);
        arr.push({ x, y, w: BRICK_W, h: BRICK_H, alive: true });
        }
    }
    return arr;
    }

    function resetBallAndPaddle() {
    paddle.x = (canvas.width - paddle.w) / 2;

    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r;
    ball.vx = 0;
    ball.vy = 0;

    // când reintri în SERVE, curățăm drop-urile rămase pe ecran
    powerUps.length = 0;
    }

    function ballSpeedForLevel(level) {
    return BASE_BALL_SPEED * (1 + (level - 1) * SPEED_PER_LEVEL);
    }

    function rowsForLevel(level) {
    return Math.min(MAX_BRICK_ROWS, BASE_BRICK_ROWS + (level - 1));
    }

    function clearEffects() {
    if (wideTimeoutId) { clearTimeout(wideTimeoutId); wideTimeoutId = null; }
    if (slowTimeoutId) { clearTimeout(slowTimeoutId); slowTimeoutId = null; }
    paddle.w = PADDLE_BASE_W;
    game.ballSpeedLimit = null;
    }

    function startLevel(level) {
    clearEffects();
    powerUps.length = 0;

    game.level = level;
    brickRows = rowsForLevel(level);
    bricks = buildBricks(brickRows);

    resetBallAndPaddle();
    game.status = "SERVE";
    }

    function launchBall() {
    // un unghi inițial controlabil (în sus), ca să nu plece perfect vertical
    const speed = ballSpeedForLevel(game.level);
    const angle = (-Math.PI / 2) + (Math.random() * 0.8 - 0.4); // -90° ± ~23°
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    game.status = "PLAYING";
    }

    function resetGame() {
    game.score = 0;
    game.lives = 3;
    startLevel(1);
    }

    // --- Power-up helpers ---
    function clampBallSpeed() {
    if (game.ballSpeedLimit == null) return;
    const s = Math.hypot(ball.vx, ball.vy);
    if (s <= 0) return;
    if (s > game.ballSpeedLimit) {
      const k = game.ballSpeedLimit / s;
      ball.vx *= k;
      ball.vy *= k;
    }
    }

    function spawnPowerUp(x, y) {
    const type = Math.random() < 0.5 ? "WIDE" : "SLOW";
    powerUps.push({ x, y, vy: POWERUP_FALL_SPEED, size: POWERUP_SIZE, type });
    }

    function applyPowerUp(type) {
    if (type === "WIDE") {
      paddle.w = Math.round(PADDLE_BASE_W * POWERUP_WIDE_MULT);
      paddle.x = clamp(paddle.x, 0, canvas.width - paddle.w);

      if (wideTimeoutId) clearTimeout(wideTimeoutId);
      wideTimeoutId = setTimeout(() => {
        paddle.w = PADDLE_BASE_W;
        paddle.x = clamp(paddle.x, 0, canvas.width - paddle.w);
        wideTimeoutId = null;
      }, POWERUP_WIDE_MS);

      return;
    }

    if (type === "SLOW") {
      game.ballSpeedLimit = ballSpeedForLevel(game.level) * POWERUP_SLOW_FACTOR;
      clampBallSpeed();

      if (slowTimeoutId) clearTimeout(slowTimeoutId);
      slowTimeoutId = setTimeout(() => {
        game.ballSpeedLimit = null;
        slowTimeoutId = null;
      }, POWERUP_SLOW_MS);

      return;
    }
    }

    function updatePowerUps(dt) {
    for (let i = powerUps.length - 1; i >= 0; i--) {
      const pu = powerUps[i];
      pu.y += pu.vy * dt;

      const half = pu.size / 2;
      const puLeft = pu.x - half;
      const puRight = pu.x + half;
      const puTop = pu.y - half;
      const puBottom = pu.y + half;

      const paddleLeft = paddle.x;
      const paddleRight = paddle.x + paddle.w;
      const paddleTop = paddle.y;
      const paddleBottom = paddle.y + paddle.h;

      const caught =
        puRight >= paddleLeft &&
        puLeft <= paddleRight &&
        puBottom >= paddleTop &&
        puTop <= paddleBottom;

      if (caught) {
        applyPowerUp(pu.type);
        powerUps.splice(i, 1);
        continue;
      }

      // a căzut în afara ecranului
      if (puTop > canvas.height) {
        powerUps.splice(i, 1);
      }
    }
    }

    // Inițializăm jocul
    resetGame();

    window.addEventListener("keydown", (e) => {
    if (e.code === "ArrowLeft") { keys.left = true; e.preventDefault(); }
    if (e.code === "ArrowRight") { keys.right = true; e.preventDefault(); }

    if (e.code === "Space") {
        e.preventDefault();
        if (game.status === "SERVE") {
            launchBall();
        } else if (game.status === "WIN") {
            startLevel(game.level + 1);
        } else if (game.status === "GAME_OVER") {
            resetGame();
        }
    }
    });

    window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft") keys.left = false;
    if (e.code === "ArrowRight") keys.right = false;
    });

    // --- Timing ---
    let lastTs = performance.now();

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function update(dt) {
    // întotdeauna permitem mișcarea paletei (inclusiv în SERVE)
    let dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;

    paddle.x += dir * paddle.speed * dt;
    paddle.x = clamp(paddle.x, 0, canvas.width - paddle.w);

    if (game.status === "SERVE") {
        // mingea stă pe paletă
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r;
        return;
    }

  if (game.status !== "PLAYING") return;

    // --- Ball movement ---
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // --- Wall collisions ---
    if (ball.x - ball.r < 0) {
        ball.x = ball.r;
        ball.vx *= -1;
    } else if (ball.x + ball.r > canvas.width) {
        ball.x = canvas.width - ball.r;
        ball.vx *= -1;
    }

    if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.vy *= -1;
    }

    // --- Paddle collision (bounce with angle) ---
    if (ball.vy > 0) {
        const paddleLeft = paddle.x;
        const paddleRight = paddle.x + paddle.w;
        const paddleTop = paddle.y;
        const paddleBottom = paddle.y + paddle.h;

        const ballLeft = ball.x - ball.r;
        const ballRight = ball.x + ball.r;
        const ballTop = ball.y - ball.r;
        const ballBottom = ball.y + ball.r;

        const intersects =
        ballRight >= paddleLeft &&
        ballLeft <= paddleRight &&
        ballBottom >= paddleTop &&
        ballTop <= paddleBottom;

        if (intersects) {
        ball.y = paddleTop - ball.r;

        const paddleCenter = paddle.x + paddle.w / 2;
        let hit = (ball.x - paddleCenter) / (paddle.w / 2);
        hit = Math.max(-1, Math.min(1, hit));

        const speed = Math.hypot(ball.vx, ball.vy) * 1.003; // +0.3% per hit
        const angle = hit * MAX_BOUNCE_ANGLE;

        ball.vx = speed * Math.sin(angle);
        ball.vy = -Math.abs(speed * Math.cos(angle));
        }
    }

    // --- Brick collisions ---
    const ballLeft = ball.x - ball.r;
    const ballRight = ball.x + ball.r;
    const ballTop = ball.y - ball.r;
    const ballBottom = ball.y + ball.r;

    for (const br of bricks) {
        if (!br.alive) continue;

        const brLeft = br.x;
        const brRight = br.x + br.w;
        const brTop = br.y;
        const brBottom = br.y + br.h;

        const hit =
        ballRight >= brLeft &&
        ballLeft <= brRight &&
        ballBottom >= brTop &&
        ballTop <= brBottom;

        if (hit) {
        br.alive = false;
        game.score += 10;

        // șansă să apară un power-up
        if (Math.random() < POWERUP_CHANCE) {
          spawnPowerUp(br.x + br.w / 2, br.y + br.h / 2);
        }

        // determinăm axa de ricoșeu pe baza „penetrării” minime
        const overlapX = Math.min(ballRight - brLeft, brRight - ballLeft);
        const overlapY = Math.min(ballBottom - brTop, brBottom - ballTop);

        if (overlapX < overlapY) {
            // bounce pe X
            if (ball.x < br.x + br.w / 2) ball.x -= overlapX;
            else ball.x += overlapX;
            ball.vx *= -1;
        } else {
            // bounce pe Y
            if (ball.y < br.y + br.h / 2) ball.y -= overlapY;
            else ball.y += overlapY;
            ball.vy *= -1;
        }

        // lovim maxim o cărămidă per frame (simplificare stabilă)
        break;
        }
    }

    // Power-ups falling / pickup
    updatePowerUps(dt);

    // aplicăm eventuale limitări de viteză (SLOW)
    clampBallSpeed();

    // Win condition
    if (!bricks.some(b => b.alive)) {
    game.status = "WIN";
    return;
    }

    // --- Bottom: lose a life ---
    if (ball.y - ball.r > canvas.height) {
    game.lives -= 1;
    if (game.lives <= 0) {
        game.status = "GAME_OVER";
    } else {
        resetBallAndPaddle();
        game.status = "SERVE";
    }
    }
    }

    function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Bricks - cu efect 3D
    const brickColors = [
        "#e74c3c", // roșu
        "#e67e22", // portocaliu
        "#f39c12", // galben-portocaliu
        "#2ecc71", // verde
        "#3498db", // albastru
        "#9b59b6", // violet
        "#1abc9c", // turcoaz
        "#34495e"  // gri închis
    ];

    for (let i = 0; i < bricks.length; i++) {
        const br = bricks[i];
        if (!br.alive) continue;

        const row = Math.floor(i / BRICK_COLS);
        const baseColor = brickColors[row % brickColors.length];
        
        // Umbrire pentru profunzime (partea de jos și dreapta)
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fillRect(br.x + 2, br.y + 2, br.w, br.h);
        
        // Corpul principal al cărămizii
        ctx.fillStyle = baseColor;
        ctx.fillRect(br.x, br.y, br.w, br.h);
        
        // Highlight (partea de sus și stânga pentru efect 3D)
        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        ctx.fillRect(br.x, br.y, br.w, 2); // linie sus
        ctx.fillRect(br.x, br.y, 2, br.h); // linie stânga
        
        // Umbră interioară (jos și dreapta)
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(br.x, br.y + br.h - 2, br.w, 2); // linie jos
        ctx.fillRect(br.x + br.w - 2, br.y, 2, br.h); // linie dreapta
        
        // Border subțire
        ctx.strokeStyle = "rgba(0, 0, 0, 0.5)";
        ctx.lineWidth = 1;
        ctx.strokeRect(br.x, br.y, br.w, br.h);
    }

    // Power-ups - cu efect 3D
    for (const pu of powerUps) {
      const half = pu.size / 2;
      const px = pu.x - half;
      const py = pu.y - half;

      // Umbră
      ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
      ctx.fillRect(px + 2, py + 2, pu.size, pu.size);

      // Culoare pe baza tipului
      if (pu.type === "WIDE") {
        ctx.fillStyle = "#3498db"; // albastru pentru WIDE
      } else {
        ctx.fillStyle = "#e74c3c"; // roșu pentru SLOW
      }
      ctx.fillRect(px, py, pu.size, pu.size);

      // Highlight
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.fillRect(px, py, pu.size, 2);
      ctx.fillRect(px, py, 2, pu.size);

      // Border
      ctx.strokeStyle = "rgba(0, 0, 0, 0.5)";
      ctx.lineWidth = 1;
      ctx.strokeRect(px, py, pu.size, pu.size);

      // Litera
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(pu.type === "WIDE" ? "W" : "S", pu.x, pu.y);
    }

    // Paddle - cu efect 3D
    // Umbră
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.fillRect(paddle.x + 3, paddle.y + 3, paddle.w, paddle.h);
    
    // Gradient pentru volum
    const paddleGradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    paddleGradient.addColorStop(0, "#f0f0f0");
    paddleGradient.addColorStop(0.5, "#d0d0d0");
    paddleGradient.addColorStop(1, "#b0b0b0");
    ctx.fillStyle = paddleGradient;
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    
    // Highlight sus
    ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
    ctx.fillRect(paddle.x, paddle.y, paddle.w, 3);
    
    // Highlight stânga
    ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
    ctx.fillRect(paddle.x, paddle.y, 3, paddle.h);
    
    // Umbră jos
    ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
    ctx.fillRect(paddle.x, paddle.y + paddle.h - 2, paddle.w, 2);
    
    // Border
    ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
    ctx.lineWidth = 1;
    ctx.strokeRect(paddle.x, paddle.y, paddle.w, paddle.h);

    // Ball - cu gradient radial pentru efect 3D
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    
    // Gradient radial - sursa de lumină din stânga-sus
    const ballGradient = ctx.createRadialGradient(
        ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, ball.r * 0.1,
        ball.x, ball.y, ball.r
    );
    ballGradient.addColorStop(0, "#ffffff");    // highlight strălucitor
    ballGradient.addColorStop(0.3, "#f5f5f5");
    ballGradient.addColorStop(0.7, "#d0d0d0");
    ballGradient.addColorStop(1, "#a0a0a0");    // umbră pe margine
    
    ctx.fillStyle = ballGradient;
    ctx.fill();
    
    // Border subțire pentru definiție
    ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
    ctx.lineWidth = 1;
    ctx.stroke();
    
    ctx.closePath();

    // HUD
    ctx.fillStyle = "#9aa0a6";
    ctx.font = "14px system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(`Score: ${game.score}`, 10, 22);
    ctx.fillText(`Lives: ${game.lives}`, 110, 22);
    ctx.fillText(`Level: ${game.level}`, 200, 22);

    const effects = [];
    if (wideTimeoutId) effects.push("WIDE");
    if (game.ballSpeedLimit != null) effects.push("SLOW");
    ctx.fillText(`Effects: ${effects.length ? effects.join(", ") : "-"}`, 290, 22);

    // Overlay for WIN / GAME OVER
    if (game.status !== "PLAYING") {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#e6e6e6";
    ctx.font = "26px system-ui, sans-serif";

    let msg = "";
    let msg2 = "";

    if (game.status === "SERVE") {
        msg = `LEVEL ${game.level}`;
        msg2 = "Apasă SPACE pentru start";
    } else if (game.status === "WIN") {
        msg = "YOU WIN";
        msg2 = "Apasă Space pentru nivelul următor";
    } else if (game.status === "GAME_OVER") {
        msg = "GAME OVER";
        msg2 = "Apasă Space pentru restart";
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(msg, canvas.width / 2, canvas.height / 2 - 10);

    ctx.font = "16px system-ui, sans-serif";
    ctx.fillText(msg2, canvas.width / 2, canvas.height / 2 + 24);
    }
    }



    function loop(ts) {
      const dt = (ts - lastTs) / 1000; // secunde
      lastTs = ts;

      // Protecție simplă dacă tab-ul a fost inactiv (dt mare)
      const safeDt = Math.min(dt, 1 / 30);

      update(safeDt);
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
